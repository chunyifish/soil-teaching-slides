SOIL_5_YAML_風格定義檔:
  style_name: "黑白手繪教學圖解風"
  version: "2.1"
  purpose: "用於教學簡報、流程說明、制度說明、工作流教學與操作指南"
  core_principle: "風格服務理解，結構優先於風格，風格優先於裝飾。"

  core_enforcement_rule: "參考圖僅用於抽取視覺風格，不用於複製版面；每頁版型必須依 SOIL-3 的頁面角色與結構類型重新判斷。"

  reference_usage_policy:
    reference_scope:
      purpose: "附件圖片只作為視覺風格參考，不作為版面配置範本。"
      apply:
        - "黑白手繪線稿風格"
        - "少量橘色重點強調"
        - "粗黑體標題氣質"
        - "教學手冊感與說明感"
        - "框線、卡片、標籤、頁碼等視覺語言"
        - "具體物件作為教學隱喻"
      do_not_apply:
        - "不可直接複製附件圖片的固定排版"
        - "不可照搬原圖的欄位配置、區塊位置或構圖比例"
        - "不可將參考圖視為版型模板"
        - "不可為了模仿參考圖而犧牲頁面結構清晰度"

    layout_decision_policy:
      source_of_truth: "SOIL-3 頁面角色與架構表"
      rules:
        - "每頁版型必須依該頁的頁面角色重新判斷"
        - "每頁版型必須依該頁的結構類型重新判斷"
        - "先判斷資訊關係，再決定版型"
        - "版型需服務理解任務，而非追隨參考圖構圖"
        - "若頁面本質為比較、流程、因果、循環、層級等，應使用對應結構呈現"

    priority_order:
      1: "SOIL-3 頁面角色與結構類型"
      2: "本頁教學任務"
      3: "本頁資訊關係"
      4: "視覺風格一致性"
      5: "美感與裝飾"

  visual_style:
    overall_tone:
      - "黑白線稿為主"
      - "少量橘色作為重點強調"
      - "教學感"
      - "說明感"
      - "手冊感"
      - "乾淨"
      - "清楚"
      - "有秩序"
    visual_metaphor:
      - "像課堂講義"
      - "像教學手冊"
      - "像流程說明書"
      - "像制度操作指南"
    illustration_style:
      type: "手繪線稿插圖"
      line_quality:
        - "鉛筆素描感"
        - "細緻灰階陰影"
        - "物件邊界清楚"
        - "可帶少量手繪質感，但不可模糊"
      object_style:
        - "具體物件優先"
        - "物件需具備教學隱喻功能"
        - "插圖以灰階呈現，避免彩色雜訊"
      suggested_objects:
        - "手冊"
        - "表單"
        - "日曆"
        - "筆電"
        - "資料夾"
        - "印章"
        - "黑板"
        - "筆記本"
        - "放大鏡"
        - "流程圖"
        - "檢核表"
      avoid:
        - "過度寫實照片"
        - "高飽和插畫"
        - "3D卡通感"
        - "複雜背景"
        - "無助理解的裝飾性圖案"

  color_system:
    primary_colors:
      background: "#FFFFFF"
      text_primary: "#000000"
      line_primary: "#111111"
      line_secondary: "#555555"
      gray_shadow: "#D9D9D9"
      gray_light: "#F5F5F5"
      page_number_gray: "#6B6B6B"
      takeaway_border_light: "#D9D9D9"
      accent_orange: "#FF5A00"

    usage_rules:
      black:
        use_for:
          - "主標題"
          - "主要文字"
          - "圖像主線條"
          - "框線"
      gray:
        use_for:
          - "插圖陰影"
          - "次要線條"
          - "背景層次"
          - "物件質感"
          - "頁碼區塊底色使用中灰 #6B6B6B，不可使用黑色或近黑色"
          - "底部帶走句框線使用淺灰 #D9D9D9，不可使用黑色或深灰色"
      orange:
        use_for:
          - "數字標記"
          - "關鍵詞強調"
          - "流程線"
          - "頁首底線"
          - "提示圖示"
          - "重點框中的強調字"
        restriction:
          - "每頁只用於少數關鍵位置"
          - "不可大面積鋪色"
          - "不可同時強調太多文字"
          - "橘色只標示真正需要學生注意或帶走的地方"

    emphasis_ratio:
      black: "70%"
      gray: "20%"
      orange: "10%以下"

  typography:
    language: "繁體中文"
    font_reference: "所有可見文字皆使用類似微軟正黑體的清楚繁體中文無襯線字；包含頁碼、單元標籤、主標題、圖中標籤、插圖內小字與底部帶走句。"
    font_style:
      title: "類似微軟正黑體的粗黑體，厚重、有力量"
      subtitle: "類似微軟正黑體的粗體或中黑體"
      body: "類似微軟正黑體、清楚易讀的無襯線字"
      label: "類似微軟正黑體的粗體標籤字"

    hierarchy:
      page_number:
        style: "中灰底 #6B6B6B、白字；不可使用黑底或近黑底"
        size: "極大"
        position_preference: "左上角"
        function: "幫助定位頁面階段"
      section_label:
        content_rule: "每頁只使用 SOIL 計畫中已核准的一個單元標籤；不可串接多個短標籤、不可自行改寫"
        style: "類似微軟正黑體的固定小標題，加固定長度與粗細的短橘色底線"
        size: "全份簡報固定一致，且小於主標題"
        consistency: "在所有頁面維持相同位置、字級、字重、與頁碼的間距、文字基線、底線起點、底線長度與底線粗細"
        function: "標示本頁所屬段落或任務"
      main_title:
        style: "超大黑體"
        weight: "heavy"
        alignment: "依 SOIL-3 頁面結構決定，不固定模仿參考圖"
        function: "建立本頁視覺入口"
      card_title:
        style: "粗黑體"
        weight: "bold"
      key_phrase:
        style: "黑字中插入橘色關鍵詞"
        rule: "只強調真正需要被帶走的詞"

    text_rules:
      - "主標題字級要大，形成強烈視覺入口"
      - "一頁只允許一個主要標題"
      - "關鍵詞可用橘色，但不可整句橘色"
      - "避免長句與密集段落"
      - "文字以短語、標籤、任務句為主"
      - "文字量需服從本頁理解任務，不追求填滿版面"
      - "所有可見字體必須類似微軟正黑體，不可混用手寫體、書法體、襯線體或英文佔位文字"

  layout_language:
    general_layout:
      - "白底留白明顯"
      - "黑色框線建立資訊區塊"
      - "橘色用於導引視線"
      - "版面需有明確閱讀順序"
      - "每個區塊像教學卡片或手冊頁籤"
      - "實際版型需依 SOIL-3 的頁面角色與結構類型決定"

    frame_style:
      card:
        border: "黑色或深灰線框"
        radius: "中度圓角"
        fill: "白色或極淺灰"
        shadow: "不使用明顯陰影，可用灰階線稿陰影"
      highlight_box:
        border: "黑色細框"
        fill: "白色"
        emphasis: "橘色圖示或橘色關鍵詞"

    spacing:
      - "區塊之間保留足夠白邊"
      - "插圖與文字不可貼太近"
      - "主要物件周圍要留空，避免擁擠"
      - "底部提示框需與主內容區明確分離"
      - "留白應幫助學生辨識層次，而非只是美觀"

  visual_components:
    page_header:
      components:
        - "左上角中灰底 #6B6B6B、白字頁碼；不可使用黑底或近黑底"
        - "頁碼右側只放一個已核准的小型單元標籤"
        - "單元標籤下方使用固定長度與粗細的短橘色底線"
      consistency_rule: "所有頁面使用完全相同的頁碼方塊尺寸與位置，以及相同的單元標籤位置、字級、字重、間距、基線、底線起點、底線長度與底線粗細"
      rule: "頁首只用於定位，不得串接多個關鍵詞或承載頁面摘要"

    number_badge:
      style: "橘色圓形底，白色數字"
      use_for:
        - "流程步驟"
        - "分類項目"
        - "重要順序"
      rule: "數字標記應協助辨識順序，不只是裝飾"

    bottom_reminder_bar:
      style:
        - "白底、細淺灰框 #D9D9D9；不可使用黑框或深灰框"
        - "可搭配橘色圖示"
        - "黑字為主，橘色標出核心行動詞"
      use_for:
        - "本頁最後要帶走的一句話"
        - "提醒"
        - "行動指令"
        - "重點收束"
      rule: "底部提示框應成為本頁出口，不可放入新概念"

    icon_style:
      type: "線稿圖示"
      color: "黑灰為主，必要時搭配橘色"
      use_for:
        - "提示"
        - "流程"
        - "文件"
        - "日程"
        - "表單"
        - "行動"
      avoid:
        - "彩色 emoji 風"
        - "過度卡通"
        - "與主插圖風格不一致"

  instructional_design_rules:
    cognitive_function:
      reduce_noise:
        - "背景保持白色"
        - "避免漸層、花紋與多餘裝飾"
        - "每頁只保留必要圖像與關鍵文字"
      chunking:
        - "用框線、頁籤、卡片或分區呈現資訊群組"
        - "相同層級的元素使用相同尺寸與樣式"
      signaling:
        - "橘色只標示關鍵詞、流程線、數字與出口句"
        - "粗體用於標題與重要標籤"
      coherence:
        - "插圖必須與概念直接相關"
        - "圖像應幫助理解，不作為填空裝飾"
      sequencing:
        - "若有順序，應使用數字、箭頭或水平導引線"
        - "若有分類，應使用並列卡片或分區"
        - "若有提醒，應放在底部出口區"

  structure_support_rules:
    comparison:
      visual_rule: "使用左右並列、上下並列或對照卡片"
      emphasis: "差異詞可用橘色"
      note: "實際並列方式由 SOIL-3 的頁面結構決定"
    process:
      visual_rule: "使用流程線、箭頭、數字節點或階段卡片"
      emphasis: "每一步搭配一個具體圖像或標籤"
      note: "流程方向不固定，需依內容脈絡決定"
    hierarchy:
      visual_rule: "使用頁籤、層級框、樹狀或分層排列"
      emphasis: "層級標題使用粗黑體"
      note: "不可只用條列取代層級關係"
    system:
      visual_rule: "可用中心概念加周邊連線，但線條需簡潔"
      emphasis: "中心概念可用圓形或粗框強調"
      note: "中心放置位置不固定，需依頁面任務決定"
    checklist:
      visual_rule: "使用手冊、表單、打勾、清單圖像"
      emphasis: "已完成或必做項目可用橘色標記"
      note: "檢核項目需有明確分類或順序"
    reminder:
      visual_rule: "使用底部或側邊提醒框"
      emphasis: "行動詞以橘色標示"
      note: "提醒框位置可依版型調整，不固定模仿參考圖"

  slide_types:
    opening_slide:
      features:
        - "大標題"
        - "中心概念圖像"
        - "少量分類卡片"
        - "一句重點提醒"
      layout_rule: "版型由 SOIL-3 決定，不固定採用參考圖構圖"

    process_slide:
      features:
        - "清楚時間線或流程線"
        - "每階段一個圖像與標籤"
        - "橘色數字節點"
        - "一句階段收束語"
      layout_rule: "流程方向、節點數量與空間配置依內容重新判斷"

    manual_slide:
      features:
        - "大型手冊或文件隱喻圖像"
        - "分類標籤"
        - "提醒框"
      layout_rule: "手冊隱喻可保留，但不固定使用原圖左右配置"

    concept_slide:
      features:
        - "單一大概念"
        - "具體隱喻圖像"
        - "少量文字"
        - "關鍵詞橘色強調"
      layout_rule: "概念位置、圖像比例、文字位置依本頁理解任務決定"

    summary_slide:
      features:
        - "黑白主視覺"
        - "橘色標出最後行動"
        - "一句可帶走的話"
      layout_rule: "總結結構依內容關係決定，可為聚合、遞進、層級或行動清單"

  generation_constraints:
    must:
      - "套用附件圖片的視覺風格，但僅限於色彩、線稿質感、字體氣質、框線語言與圖像風格"
      - "保持白底、黑字、灰階線稿、橘色重點"
      - "每頁只能有一個主要視覺焦點"
      - "每頁只能有一個主要教學任務"
      - "使用具體物件隱喻抽象概念"
      - "保留足夠留白"
      - "讓標題、圖像、提示框共同指向同一個重點"
      - "每頁版型必須依 SOIL-3 指定的頁面角色與結構類型重新判斷"
      - "先判斷資訊關係，再決定版型與視覺配置"
      - "結構優先於風格，風格優先於裝飾"

    must_not:
      - "不可直接複製參考圖的版面配置"
      - "不可將參考圖中的區塊位置、構圖方式、欄位編排視為固定模板"
      - "不可為了模仿參考圖而破壞頁面結構清晰度"
      - "不可使用照片式背景"
      - "不可使用多色彩虹配色"
      - "不可讓插圖比重點文字更搶眼"
      - "不可把所有內容做成條列"
      - "不可使用與教學內容無關的裝飾"
      - "不可讓橘色到處出現，削弱強調效果"

  rendering_logic:
    priority_order:
      1: "先確認 SOIL-3 指定的頁面角色"
      2: "再確認 SOIL-3 指定的結構類型"
      3: "確認本頁教學任務"
      4: "判斷本頁資訊關係"
      5: "選擇能支援理解的版型"
      6: "配置黑白線稿插圖"
      7: "加入橘色重點提示"
      8: "最後檢查版面是否乾淨、可讀、可一眼理解"

    final_check:
      - "學生是否能在 3 秒內知道本頁主題？"
      - "學生是否能看出資訊之間的關係？"
      - "本頁版型是否依 SOIL-3 的頁面角色與結構類型決定？"
      - "是否只是套用參考圖風格，而沒有複製參考圖排版？"
      - "橘色是否只強調真正重要的地方？"
      - "插圖是否真的幫助理解？"
      - "提示語是否能收束本頁重點？"

  output_instruction:
    instruction: "請套用此 YAML 的視覺風格，但不要模仿附件圖片的固定排版；每頁版型仍需依 SOIL-3 的頁面角色與結構類型重新判斷。"
